# Created by claude
# Deploys the static site to GitHub Pages on every push to main.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          DV=v1.1.3
          curl -sL "https://github.com/duckdb/duckdb/releases/download/${DV}/duckdb_cli-linux-amd64.zip" -o duckdb.zip
          unzip -q duckdb.zip
          sudo mv duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Fetch dataset
        run: make fetch

      - name: Build site
        run: make site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
